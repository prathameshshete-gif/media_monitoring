# /etc/nginx/sites-available/media-monitoring
#
# media-monitoring.duckdns.org -> the container on 127.0.0.1:8010.
# Certbot rewrites this file when the certificate is issued; the pre-TLS shape
# below is what gets installed first.

server {
    server_name media-monitoring.duckdns.org;

    # Anyone reaching this can start a run, which scrapes publishers and spends
    # the Gemini quota. One shared login, managed with htpasswd.
    auth_basic "Media Monitor";
    auth_basic_user_file /etc/nginx/.htpasswd.media-monitoring;

    # Certbot's HTTP-01 challenge must not sit behind the password, or
    # renewal fails ninety days from now with no one watching.
    location ^~ /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Run progress arrives over SSE. Buffering would hold the events until the
    # run finished, which is exactly the opposite of the point; a run can also
    # sit quiet for minutes inside the cross-encoder, so the read timeout has
    # to outlast it.
    location /api/jobs/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # A report is a few hundred KB of Devanagari and the corpus can be larger.
    client_max_body_size 20m;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/media-monitoring.duckdns.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/media-monitoring.duckdns.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = media-monitoring.duckdns.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name media-monitoring.duckdns.org;

    listen 80;
    return 404; # managed by Certbot


}